name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt pytest

      - name: Server tests
        run: pytest -q

      - name: Check the page's JavaScript
        run: |
          sed -n '/<script>/,/<\/script>/p' index.html | sed '1d;$d' > page.js
          node --check page.js
